<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Mono',monospace;background:#09090b;color:#fafafa;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:2px}
.tab-bar{display:flex;overflow-x:auto;gap:4px;padding:12px 16px 0;background:#09090b;border-bottom:1px solid #18181b;scrollbar-width:none;-ms-overflow-style:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:6px 6px 0 0;font-size:11px;font-family:inherit;cursor:pointer;border:none;white-space:nowrap;background:#18181b;color:#71717a;transition:all .15s}
.tab.active{background:#27272a;color:#fafafa}
.tab:hover{color:#a1a1aa}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#09090b;border-bottom:1px solid #18181b}
.topbar h1{font-size:13px;font-weight:700;flex:1;letter-spacing:.05em}
.btn{padding:6px 10px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer;border:1px solid #27272a;background:#18181b;color:#a1a1aa;transition:all .15s}
.btn:hover{background:#27272a;color:#fafafa}
.btn.active{background:#27272a;color:#fafafa}
.search-bar{padding:8px 16px;background:#09090b}
.search-bar input{width:100%;padding:7px 12px;border-radius:6px;border:1px solid #27272a;background:#18181b;color:#fafafa;font-family:inherit;font-size:12px;outline:none}
.search-bar input:focus{border-color:#52525b}
.content{padding:12px 16px;overflow-y:auto}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:#18181b;margin-bottom:6px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.item:hover{border-color:#27272a;background:#1c1c1f}
.item-title{font-size:13px;font-weight:500;flex:1}
.item-detail{font-size:11px;color:#71717a}
.item-year{font-size:10px;color:#52525b}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.watched{background:#22c55e}
.dot.watching{background:#3b82f6}
.dot.to_watch{background:#3f3f46}
.rating{display:flex;gap:2px}
.rating span{font-size:10px;color:#52525b}
.rating span.filled{color:#eab308}
.badge{padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;background:#27272a;color:#71717a}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#18181b;border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;border:1px solid #27272a}
.modal h2{font-size:14px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#71717a;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #27272a;background:#09090b;color:#fafafa;font-family:inherit;font-size:12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#52525b}
.field select option{background:#18181b}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-btns button{flex:1;padding:8px;border-radius:6px;font-family:inherit;font-size:12px;cursor:pointer;border:none;font-weight:600}
.btn-save{background:#27272a;color:#fafafa}
.btn-save:hover{background:#3f3f46}
.btn-cancel{background:#18181b;color:#71717a;border:1px solid #27272a}
.btn-delete{background:#7f1d1d;color:#fca5a5}
.empty{text-align:center;padding:40px;color:#3f3f46;font-size:12px}
.status-filter{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.status-filter::-webkit-scrollbar{display:none}
.filter-btn{padding:4px 10px;border-radius:20px;font-size:10px;font-family:inherit;cursor:pointer;border:1px solid #27272a;background:transparent;color:#71717a;white-space:nowrap}
.filter-btn.active{background:#27272a;color:#fafafa;border-color:#3f3f46}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#3f3f46;flex-shrink:0}
.sync-dot.syncing{background:#3b82f6;animation:pulse 1s infinite}
.sync-dot.synced{background:#22c55e}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.section-header{font-size:10px;color:#3f3f46;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:12px 0 6px}
</style>

// Supabase
let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}

// ── State ──────────────────────────────────────────────────────────────────
function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (!p.documentary) p.documentary = [];
      if (!p.show) p.show = [];
      if (!p.books) p.books = [];
      if (!p.games) p.games = [];
      if (!p.watchlist) p.watchlist = [];
      return p;
    }
  } catch(e){}
  return BACKUP.data;
}

function loadTabs() {
  try {
    const s = localStorage.getItem(TABS_KEY);
    if (s) return JSON.parse(s);
  } catch(e){}
  return BACKUP.tabs;
}

let state = {
  data: loadData(),
  tabs: loadTabs(),
  activeTab: '__watching',
  search: '',
  statusFilter: 'all',
  modal: null,         // null or item being edited
  addModal: false,
  syncStatus: 'idle',  // idle | syncing | synced
  darkMode: true
};

// ── Supabase sync ──────────────────────────────────────────────────────────
let saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!sb) return;
    state.syncStatus = 'syncing'; render();
    try {
      await sb.from('watchlist').upsert({
        id: 'numa',
        data: state.data,
        tabs: state.tabs,
        updated_at: new Date().toISOString()
      });
      localStorage.setItem(SAVE_TS_KEY, Date.now().toString());
      state.syncStatus = 'synced'; render();
      setTimeout(() => { state.syncStatus = 'idle'; render(); }, 2000);
    } catch(e) { state.syncStatus = 'idle'; render(); }
  }, 1500);
}

async function loadFromSupabase() {
  if (!sb) return;
  try {
    const { data: row } = await sb.from('watchlist').select('*').eq('id','numa').single();
    if (!row) return;
    const localTs = parseInt(localStorage.getItem(SAVE_TS_KEY)||'0');
    const remoteTs = new Date(row.updated_at).getTime();
    if (remoteTs > localTs + 5000) {
      const d = row.data;
      if (!d.documentary) d.documentary=[];
      if (!d.show) d.show=[];
      if (!d.books) d.books=[];
      if (!d.games) d.games=[];
      if (!d.watchlist) d.watchlist=[];
      state.data = d;
      state.tabs = row.tabs || state.tabs;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
      localStorage.setItem(TABS_KEY, JSON.stringify(row.tabs));
      localStorage.setItem(SAVE_TS_KEY, remoteTs.toString());
      render();
    }
  } catch(e){}
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    localStorage.setItem(TABS_KEY, JSON.stringify(state.tabs));
  } catch(e){}
}

// ── Helpers ────────────────────────────────────────────────────────────────
function uid() { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

function getItems(tabId) {
  const d = state.data;
  if (tabId === '__watching') {
    const all = [];
    const sections = ['series','mini','manga','films','james_bond','documentary','show','watchlist','games','books'];
    sections.forEach(s => {
      if (Array.isArray(d[s])) {
        d[s].forEach(item => {
          if (item.statut === 'watching') all.push({...item, _section: s});
        });
      }
    });
    // Collections
    if (d.collections) {
      Object.entries(d.collections).forEach(([col, items]) => {
        if (Array.isArray(items)) items.forEach(item => {
          if (item.statut === 'watching') all.push({...item, _section: 'collections', _col: col});
        });
      });
    }
    return all;
  }
  if (tabId === 'collections') return [];
  if (d[tabId] && Array.isArray(d[tabId])) return d[tabId];
  return [];
}

function getStatuts(tabId) {
  if (tabId === 'games') return [{k:'to_watch',l:'To Play'},{k:'watching',l:'Playing'},{k:'watched',l:'Played'}];
  if (tabId === 'books') return [{k:'to_watch',l:'To Read'},{k:'watching',l:'Reading'},{k:'watched',l:'Read'}];
  return [{k:'to_watch',l:'To Watch'},{k:'watching',l:'Watching'},{k:'watched',l:'Watched'}];
}

function dotClass(s) {
  if (s==='watched') return 'watched';
  if (s==='watching') return 'watching';
  return 'to_watch';
}

function stars(r) {
  let h = '';
  for(let i=1;i<=5;i++) h+=`<span class="${i<=(r||0)?'filled':''}">●</span>`;
  return h;
}

function filterItems(items) {
  let list = [...items];
  if (state.statusFilter !== 'all') list = list.filter(i => i.statut === state.statusFilter);
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(i => i.title && i.title.toLowerCase().includes(q));
  }
  return list;
}

function updateItem(tabId, item) {
  const d = state.data;
  if (item._col && d.collections && d.collections[item._col]) {
    const idx = d.collections[item._col].findIndex(x=>x.id===item.id);
    if (idx!==-1) d.collections[item._col][idx] = item;
  } else if (d[tabId] && Array.isArray(d[tabId])) {
    const idx = d[tabId].findIndex(x=>x.id===item.id);
    if (idx!==-1) d[tabId][idx] = item;
  }
  saveLocal(); scheduleSave(); render();
}

function addItem(tabId, item) {
  item.id = uid();
  item.addedAt = Date.now();
  if (!state.data[tabId]) state.data[tabId] = [];
  state.data[tabId].unshift(item);
  saveLocal(); scheduleSave(); render();
}

function deleteItem(tabId, item) {
  const d = state.data;
  if (item._col && d.collections && d.collections[item._col]) {
    d.collections[item._col] = d.collections[item._col].filter(x=>x.id!==item.id);
  } else if (d[tabId] && Array.isArray(d[tabId])) {
    d[tabId] = d[tabId].filter(x=>x.id!==item.id);
  }
  saveLocal(); scheduleSave(); render();
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(item, tabId) {
  state.modal = {...item, _tabId: tabId};
  render();
}

function openAdd() {
  state.addModal = true;
  render();
}

function closeModal() {
  state.modal = null;
  state.addModal = false;
  render();
}

// ── Render ─────────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k==='className') e.className=v;
    else if (k==='style') Object.assign(e.style, v);
    else if (k.startsWith('on')) e[k.toLowerCase()]=v;
    else e.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c => {
    if (c==null) return;
    if (typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(c));
    else if (c instanceof Node) e.appendChild(c);
  });
  return e;
}

function setHTML(e, html) { e.innerHTML=html; return e; }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderTopBar());
  app.appendChild(renderTabBar());
  app.appendChild(renderStatusFilter());
  app.appendChild(renderSearchBar());
  app.appendChild(renderContent());
  if (state.modal) app.appendChild(renderEditModal());
  if (state.addModal) app.appendChild(renderAddModal());
}

function renderTopBar() {
  const tab = state.tabs.find(t=>t.id===state.activeTab)||{label:'Watchlist'};
  const syncEl = el('div',{className:`sync-dot ${state.syncStatus==='idle'?'':'syncing'} ${state.syncStatus==='synced'?'synced':''}`});

  const addBtn = el('button',{className:'btn',onClick:openAdd},'+ Add');

  const exportBtn = el('button',{className:'btn',onClick:()=>{
    const json = JSON.stringify({data:state.data,tabs:state.tabs},null,2);
    navigator.clipboard.writeText(json).then(()=>{
      exportBtn.textContent='✓ Copied!';
      setTimeout(()=>exportBtn.textContent='↓',1500);
    });
  }},'↓');

  const importInput = el('input',{type:'file',accept:'.json',style:{display:'none'}});
  importInput.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        const d = parsed.data||parsed;
        if(!d.documentary) d.documentary=[];
        if(!d.show) d.show=[];
        if(!d.books) d.books=[];
        state.data = d;
        if(parsed.tabs) state.tabs = parsed.tabs;
        saveLocal(); scheduleSave(); render();
      } catch(err){ alert('Invalid JSON file'); }
    };
    reader.readAsText(file);
  };

  const importBtn = el('button',{className:'btn',onClick:()=>importInput.click()},'↑');

  const div = el('div',{className:'topbar'},
    el('h1',{},'W A T C H L I S T'),
    syncEl, importInput, importBtn, exportBtn, addBtn
  );
  return div;
}

function renderTabBar() {
  const bar = el('div',{className:'tab-bar'});
  state.tabs.forEach(tab => {
    const isActive = state.activeTab === tab.id;
    const t = el('button',{
      className:`tab${isActive?' active':''}`,
      onClick:()=>{ state.activeTab=tab.id; state.statusFilter='all'; state.search=''; render(); }
    }, tab.label);
    bar.appendChild(t);
  });
  return bar;
}

function renderStatusFilter() {
  const tabId = state.activeTab;
  const statuts = getStatuts(tabId);
  const bar = el('div',{className:'status-filter'});
  
  const allBtn = el('button',{
    className:`filter-btn${state.statusFilter==='all'?' active':''}`,
    onClick:()=>{ state.statusFilter='all'; render(); }
  },'All');
  bar.appendChild(allBtn);
  
  statuts.forEach(s => {
    const b = el('button',{
      className:`filter-btn${state.statusFilter===s.k?' active':''}`,
      onClick:()=>{ state.statusFilter=s.k; render(); }
    }, s.l);
    bar.appendChild(b);
  });
  return bar;
}

function renderSearchBar() {
  const input = el('input',{
    type:'text', placeholder:'Search...', value:state.search
  });
  input.onInput = e => { state.search=e.target.value; render(); };
  input.addEventListener('input', e=>{ state.search=e.target.value; render(); });
  const div = el('div',{className:'search-bar'}, input);
  return div;
}

function renderContent() {
  const tabId = state.activeTab;
  const content = el('div',{className:'content',style:{height:'calc(100vh - 160px)',overflowY:'auto'}});
  
  if (tabId === 'collections') {
    content.appendChild(renderCollections());
    return content;
  }
  
  const items = filterItems(getItems(tabId));
  
  if (items.length === 0) {
    content.appendChild(el('div',{className:'empty'},'Nothing here yet'));
    return content;
  }

  items.forEach(item => {
    content.appendChild(renderItem(item, tabId));
  });
  
  return content;
}

function renderItem(item, tabId) {
  const div = el('div',{className:'item', onClick:()=>openModal(item,tabId)});
  
  const dotEl = el('div',{className:`dot ${dotClass(item.statut)}`});
  
  const info = el('div',{style:{flex:'1',minWidth:0}});
  const title = el('div',{className:'item-title'}, item.title||'');
  info.appendChild(title);
  
  if (item.detail||item.annee||item.actor) {
    const sub = el('div',{className:'item-detail'});
    const parts = [item.detail, item.actor||'', item.annee ? String(item.annee) : ''].filter(Boolean).join(' · ');
    sub.textContent = parts;
    info.appendChild(sub);
  }
  
  div.appendChild(dotEl);
  div.appendChild(info);
  
  if (item.rating>0) {
    const r = el('div',{className:'rating'});
    setHTML(r, stars(item.rating));
    div.appendChild(r);
  }
  
  return div;
}

function renderCollections() {
  const d = state.data;
  const frag = document.createDocumentFragment();
  
  if (!d.collections) return frag;
  
  const labels = d._colLabels || {};
  
  Object.entries(d.collections).forEach(([colId, items]) => {
    if (!Array.isArray(items)) return;
    const label = labels[colId] || colId.replace(/_/g,' ').replace(/\w/g,c=>c.toUpperCase());
    
    const header = el('div',{className:'section-header'}, label);
    frag.appendChild(header);
    
    const filtered = filterItems(items);
    if (filtered.length === 0) {
      frag.appendChild(el('div',{className:'empty',style:{padding:'8px 0'}},'Empty'));
    } else {
      filtered.forEach(item => {
        frag.appendChild(renderItem({...item,_col:colId}, 'collections'));
      });
    }
  });
  
  return frag;
}

function renderEditModal() {
  const item = state.modal;
  const tabId = item._tabId || state.activeTab;
  const statuts = getStatuts(tabId);
  
  const overlay = el('div',{className:'modal-overlay', onClick:e=>{ if(e.target===overlay) closeModal(); }});
  const modal = el('div',{className:'modal'});
  
  modal.appendChild(el('h2',{},item.title||'Edit'));
  
  // Status select
  const statusDiv = el('div',{className:'field'});
  statusDiv.appendChild(el('label',{},'Status'));
  const sel = el('select',{});
  statuts.forEach(s => {
    const opt = el('option',{value:s.k},s.l);
    if(item.statut===s.k) opt.selected=true;
    sel.appendChild(opt);
  });
  statusDiv.appendChild(sel);
  modal.appendChild(statusDiv);
  
  // Detail
  const detailDiv = el('div',{className:'field'});
  detailDiv.appendChild(el('label',{},'Detail / Progress'));
  const detailIn = el('input',{type:'text',value:item.detail||'',placeholder:'e.g. S2 E5, 80%, Full...'});
  detailDiv.appendChild(detailIn);
  modal.appendChild(detailDiv);
  
  // Year
  const yearDiv = el('div',{className:'field'});
  yearDiv.appendChild(el('label',{},'Year'));
  const yearIn = el('input',{type:'text',value:item.annee||'',placeholder:'2025'});
  yearDiv.appendChild(yearIn);
  modal.appendChild(yearDiv);
  
  // Rating
  const ratingDiv = el('div',{className:'field'});
  ratingDiv.appendChild(el('label',{},`Rating: ${item.rating||0}/5`));
  const ratingWrap = el('div',{style:{display:'flex',gap:'6px'}});
  for(let i=1;i<=5;i++) {
    const dot = el('button',{
      style:{background:'none',border:'none',cursor:'pointer',fontSize:'20px',color:i<=(item.rating||0)?'#eab308':'#3f3f46'},
      onClick:()=>{
        item.rating=i;
        ratingDiv.querySelector('label').textContent=`Rating: ${i}/5`;
        [...ratingWrap.children].forEach((d,idx)=>{ d.style.color=idx<i?'#eab308':'#3f3f46'; });
      }
    },'●');
    ratingWrap.appendChild(dot);
  }
  ratingDiv.appendChild(ratingWrap);
  modal.appendChild(ratingDiv);
  
  // Info
  const infoDiv = el('div',{className:'field'});
  infoDiv.appendChild(el('label',{},'Notes'));
  const infoIn = el('textarea',{rows:'2',placeholder:'Notes...'});
  infoIn.value = item.info||'';
  infoDiv.appendChild(infoIn);
  modal.appendChild(infoDiv);
  
  // Buttons
  const btns = el('div',{className:'modal-btns'});
  
  const delBtn = el('button',{className:'btn-delete',onClick:()=>{
    if(confirm('Delete?')){ deleteItem(tabId,item); closeModal(); }
  }},'Delete');
  
  const cancelBtn = el('button',{className:'btn-cancel',onClick:closeModal},'Cancel');
  
  const saveBtn = el('button',{className:'btn-save',onClick:()=>{
    item.statut = sel.value;
    item.detail = detailIn.value;
    item.annee = yearIn.value;
    item.info = infoIn.value;
    updateItem(tabId, item);
    closeModal();
  }},'Save');
  
  btns.appendChild(delBtn);
  btns.appendChild(cancelBtn);
  btns.appendChild(saveBtn);
  modal.appendChild(btns);
  
  overlay.appendChild(modal);
  return overlay;
}

function renderAddModal() {
  const tabId = state.activeTab === '__watching' ? 'series' : state.activeTab;
  const statuts = getStatuts(tabId);
  
  const overlay = el('div',{className:'modal-overlay', onClick:e=>{ if(e.target===overlay) closeModal(); }});
  const modal = el('div',{className:'modal'});
  
  modal.appendChild(el('h2',{},'Add New'));
  
  const titleDiv = el('div',{className:'field'});
  titleDiv.appendChild(el('label',{},'Title *'));
  const titleIn = el('input',{type:'text',placeholder:'Title...'});
  titleDiv.appendChild(titleIn);
  modal.appendChild(titleDiv);
  
  const statusDiv = el('div',{className:'field'});
  statusDiv.appendChild(el('label',{},'Status'));
  const sel = el('select',{});
  statuts.forEach(s => {
    const opt = el('option',{value:s.k},s.l);
    sel.appendChild(opt);
  });
  statusDiv.appendChild(sel);
  modal.appendChild(statusDiv);
  
  const detailDiv = el('div',{className:'field'});
  detailDiv.appendChild(el('label',{},'Detail'));
  const detailIn = el('input',{type:'text',placeholder:'S1 E1, 2025...'});
  detailDiv.appendChild(detailIn);
  modal.appendChild(detailDiv);
  
  const yearDiv = el('div',{className:'field'});
  yearDiv.appendChild(el('label',{},'Year'));
  const yearIn = el('input',{type:'text',placeholder:'2025'});
  yearDiv.appendChild(yearIn);
  modal.appendChild(yearDiv);
  
  const btns = el('div',{className:'modal-btns'});
  const cancelBtn = el('button',{className:'btn-cancel',onClick:closeModal},'Cancel');
  const saveBtn = el('button',{className:'btn-save',onClick:()=>{
    if(!titleIn.value.trim()){ alert('Title required'); return; }
    const sectionId = tabId === 'collections' ? 'series' : tabId;
    addItem(sectionId, {
      title: titleIn.value.trim(),
      statut: sel.value,
      detail: detailIn.value,
      annee: yearIn.value,
      rating: 0, info: '', actor: '', platform: '', genre: ''
    });
    closeModal();
  }},'Add');
  
  btns.appendChild(cancelBtn);
  btns.appendChild(saveBtn);
  modal.appendChild(btns);
  
  overlay.appendChild(modal);
  return overlay;
}

// ── Init ───────────────────────────────────────────────────────────────────
render();
loadFromSupabase();
</script>
